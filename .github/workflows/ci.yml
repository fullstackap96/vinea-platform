name: Vinea CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: vinea-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: npm

      - name: Scan repository for credential-shaped values
        run: npm run check:repository-secrets

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: npm run check:dependency-security

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run all-file typecheck
        run: npm run typecheck:all

      - name: Check release environment flags
        run: npm run check:release-env

      - name: Run RLS production evidence checks
        run: npm run check:rls-production-evidence

      - name: Run production monitoring evidence checks
        run: npm run check:production-monitoring-evidence

      - name: Run production gate boundary checks
        run: npm run check:production-gates

      - name: Run CSP report-only evidence checks
        run: npm run check:csp-report-only

      - name: Run trust-center claims boundary checks
        run: npm run check:trust-center-claims

      - name: Run release-readiness handoff checks
        run: npm run check:release-handoff

      - name: Run completed release evidence checks
        run: npm run check:release-local-evidence

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build
